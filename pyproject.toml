[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-local-os-copilot"
version = "0.1.0"
description = "A privacy-first local desktop copilot for Windows"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ollama>=0.6.3,<0.7",
    "mss==9.0.1",
    "pytesseract==0.3.10",
    "faster-whisper==1.0.2",
    "pyautogui==0.9.54",
    "keyboard==0.13.5",
    "opencv-python-headless==4.10.0.84",
    "Pillow==10.4.0",
    "pypdf==6.1.3",
    "python-docx==1.2.0",
    "sounddevice==0.5.2",
    "soundfile==0.13.1",
    "watchdog==6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "pyinstaller>=6,<7",
]

[project.scripts]
sam-benchmark = "src.benchmark:main"
sam-web = "src.server:run_server"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["src*"]