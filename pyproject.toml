[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-local-os-copilot"
version = "0.1.0"
description = "A privacy-first local desktop copilot for Windows"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ollama>=0.6.3,<0.7",
    "mss==9.0.1",
    "pytesseract==0.3.10",
    "pyautogui==0.9.54",
    "Pillow==10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
sam-benchmark = "src.benchmark:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["src*"]